ShortDescription: Free, portable DICOM viewer for CT, MR, X-ray and ultrasound in 2D, MPR and 3D.
Description: Slyced opens DICOM studies from folders, CDs/DVDs with DICOMDIR, ZIP files and PACS servers (C-FIND, C-GET, C-MOVE and DICOMweb), with MPR, curved reformation, GPU volume rendering and comparison with prior studies. No telemetry and no accounts; studies stay on the computer. Not certified as a medical device. Interface in English and Portuguese.
